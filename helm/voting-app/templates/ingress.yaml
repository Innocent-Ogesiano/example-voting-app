{{- if .Values.ingress.enabled }}
{{- range $name := list "vote" "result" }}
{{- $cfg := index $.Values.ingress $name }}
{{- $app := index $.Values $name }}
{{- $annotations := merge (deepCopy ($cfg.annotations | default dict)) (deepCopy ($.Values.ingress.annotations | default dict)) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  {{- with $.Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  - {{- if $cfg.host }}
    host: {{ $cfg.host }}
    {{- end }}
    http:
      paths:
      - path: {{ $cfg.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ $name }}
            port:
              number: {{ $app.containerPort }}
{{- end }}
{{- end }}
