apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  {{- if not .Values.vote.autoscaling.enabled }}
  replicas: {{ .Values.vote.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - image: "{{ .Values.vote.image }}:{{ .Values.vote.tag }}"
        name: vote
        {{- with .Values.vote.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.vote.containerPort }}
          name: vote
