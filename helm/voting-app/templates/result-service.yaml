apiVersion: v1
kind: Service
metadata:
  labels:
    app: result
  name: result
spec:
  type: NodePort
  ports:
  - name: "result-service"
    port: {{ .Values.result.containerPort }}
    targetPort: {{ .Values.result.containerPort }}
    nodePort: {{ .Values.result.nodePort }}
  selector:
    app: result
