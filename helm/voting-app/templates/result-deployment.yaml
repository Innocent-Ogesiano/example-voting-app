apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  {{- if not .Values.result.autoscaling.enabled }}
  replicas: {{ .Values.result.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - image: "{{ .Values.result.image }}:{{ .Values.result.tag }}"
        name: result
        {{- with .Values.result.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.result.containerPort }}
          name: result
