name: CI

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run end-to-end tests
        working-directory: result
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from sut

      - name: Tear down test stack
        if: always()
        working-directory: result
        run: docker compose -f docker-compose.test.yml down -v

  scan-build-push:
    name: Scan, build and push (${{ matrix.service }})
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: vote
            context: vote
          - service: result
            context: result
          - service: worker
            context: worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        run: echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/example-voting-app-${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          tags: ${{ env.IMAGE_TAG }}
          load: true
          push: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          tags: ${{ env.IMAGE_TAG }}
          push: true
