name: CI

on:
  push:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Run integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run end-to-end tests
        working-directory: result
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from sut

      - name: Tear down test stack
        if: always()
        working-directory: result
        run: docker compose -f docker-compose.test.yml down -v

  scan-build-push:
    name: Scan, build and push (${{ matrix.service }})
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: vote
            context: vote
          - service: result
            context: result
          - service: worker
            context: worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        run: echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/example-voting-app-${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          tags: ${{ env.IMAGE_TAG }}
          load: true
          push: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          tags: ${{ env.IMAGE_TAG }}
          push: true

  deploy:
    name: Deploy to AWS EKS
    needs: scan-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::385685326245:role/example-voting-app-github-actions-role
          aws-region: us-west-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create cluster if not already created
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name example-voting-app --region us-west-2

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-creds \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install voting-app ./helm/voting-app \
            --set imagePullSecrets[0].name=ghcr-creds \
            --set vote.image=ghcr.io/$OWNER/example-voting-app-vote \
            --set vote.tag=${{ github.sha }} \
            --set result.image=ghcr.io/$OWNER/example-voting-app-result \
            --set result.tag=${{ github.sha }} \
            --set worker.image=ghcr.io/$OWNER/example-voting-app-worker \
            --set worker.tag=${{ github.sha }} \
            --wait --timeout 5m
