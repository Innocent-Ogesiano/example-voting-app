name: CI

on:
  push:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Run integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run end-to-end tests
        working-directory: result
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from sut

      - name: Tear down test stack
        if: always()
        working-directory: result
        run: docker compose -f docker-compose.test.yml down -v

  scan-build-push:
    name: Scan, build and push (${{ matrix.service }})
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: vote
            context: vote
          - service: result
            context: result
          - service: worker
            context: worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        run: echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/example-voting-app-${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          tags: ${{ env.IMAGE_TAG }}
          load: true
          push: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          tags: ${{ env.IMAGE_TAG }}
          push: true

  deploy:
    name: Deploy to AWS EKS
    needs: scan-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables)
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'example-voting-app' }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE || 'example-voting-app-eks' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Create cluster if not already created
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install AWS Load Balancer Controller
        working-directory: terraform
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version 3.5.0 \
            --set clusterName="$CLUSTER_NAME" \
            --set region="$AWS_REGION" \
            --set vpcId="$(terraform output -raw vpc_id)" \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set enableServiceMutatorWebhook=false \
            --wait --timeout 5m
          # Each upgrade regenerates the webhook's self-signed CA, but running pods keep
          # serving the old cert, so every Service/Ingress create fails the webhook TLS
          # check. Restart so the pods pick up the new cert.
          kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=5m

      - name: Install metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update metrics-server
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system \
            --version 3.14.0 \
            --wait --timeout 5m

      - name: Install Cluster Autoscaler
        run: |
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo update autoscaler
          # The chart's default image is 1.35; the autoscaler minor must match the cluster (1.36).
          helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler \
            --namespace kube-system \
            --version 9.59.0 \
            --set autoDiscovery.clusterName="$CLUSTER_NAME" \
            --set awsRegion="$AWS_REGION" \
            --set image.tag=v1.36.1 \
            --set rbac.serviceAccount.name=cluster-autoscaler \
            --wait --timeout 5m

      - name: Install Argo CD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            --version 10.10.5 \
            --set dex.enabled=false \
            --set notifications.enabled=false \
            --wait --timeout 10m

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-creds \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Argo CD
        run: |
          # One-time migration: the app used to be a direct Helm release. Remove it so
          # Argo CD owns the resources (this recreates the ALB once).
          if helm status voting-app >/dev/null 2>&1; then
            helm uninstall voting-app
          fi

          export OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          export IMAGE_TAG="${{ github.sha }}"
          envsubst < argocd/application.yaml | kubectl apply -f -
          kubectl annotate application voting-app -n argocd argocd.argoproj.io/refresh=hard --overwrite

          kubectl wait application/voting-app -n argocd --for=jsonpath='{.status.sync.status}'=Synced --timeout=5m
          kubectl wait application/voting-app -n argocd --for=jsonpath='{.status.health.status}'=Healthy --timeout=10m
          for d in vote result worker; do
            kubectl rollout status deployment/$d --timeout=5m
          done

      - name: Show app URL
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get ingress vote -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOST" ] && break
            sleep 10
          done
          echo "vote:   http://${HOST}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "result: http://${HOST}:8080" | tee -a "$GITHUB_STEP_SUMMARY"
